name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Try the latest commit (or release, if one exists) first.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.5.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Paste a URL
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Logs, screenshots, extra context
      description: Status bar (mode, IP, yt-dlp version), terminal output, and whether a browser VPN is on.
