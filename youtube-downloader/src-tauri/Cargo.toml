[package]
name = "youtube-downloader"
version = "1.6.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "youtube_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# `tauri-build` minors do not track `tauri` (2.11 needs tauri-build 2.6).
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Pin to the same minor as the npm packages. A bare `version = "2"` lets
# Cargo settle on 2.9 while `@tauri-apps/api` is 2.11, and `tauri build`
# then refuses: "version mismatched Tauri packages".
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
dirs = "5.0"


reqwest = { version = "0.11", features = ["json", "socks", "stream"] }
regex = "1"
lazy_static = "1.4"
futures-util = "0.3"

time = { version = "0.3", features = ["parsing"] }


# Windows installs ffmpeg from a release zip; macOS uses Homebrew instead.
[target.'cfg(windows)'.dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
